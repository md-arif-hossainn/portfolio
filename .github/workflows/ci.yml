name: CI

# Runs on every push and every pull request. Vercel deploys in parallel with
# this; CI is the signal for whether that deploy is actually trustworthy.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# A new push to the same branch cancels the previous run rather than queueing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # No secrets needed: RESEND_API_KEY is read per-request at runtime, not
      # at build time, so a missing key can never break the build.
      - name: Build
        run: npm run build
