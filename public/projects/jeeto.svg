<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#g)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <circle cx="710" cy="430" r="150" fill="#FFFFFF" fill-opacity="0.08"/>
  <circle cx="80" cy="70" r="110" fill="#FFFFFF" fill-opacity="0.06"/>
  <!-- Text is centred so that a center crop (the featured card renders this
       image far taller than 16:10) never clips the title. -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#FFFFFF" text-anchor="middle">
    <text x="400" y="244" font-size="52" font-weight="700" letter-spacing="-1">Jeeto</text>
    <text x="400" y="284" font-size="24" font-weight="500" fill-opacity="0.85">Competitive Quiz Platform</text>
  </g>
</svg>
